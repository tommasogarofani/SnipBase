services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tommaso
      POSTGRES_PASSWORD: tommaso
      POSTGRES_DB: snipbase
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
