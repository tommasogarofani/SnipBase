[package]
name = "SnipBase_backend"
version = "0.1.1"
edition = "2026"

[dependencies]
axum = "0.8.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
serde = {version = "1.0.229", feature=["derive"]}
serde_json = "1.0.154"
tokio = "1"
